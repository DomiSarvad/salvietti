name: salvietti_control
description: Sistema de control e inventario de Salvietti del Sur — offline-first, multiplataforma.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend
  supabase_flutter: ^2.5.6

  # Estado
  provider: ^6.1.2

  # Almacenamiento local / offline-first
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.3
  http: ^1.2.0 # cliente propio para Supabase (ClienteOffline)

  # Utilidades
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_dotenv: ^5.1.0
  fl_chart: ^0.68.0
  data_table_2: ^2.5.15
  file_saver: ^0.2.12
  pdf: ^3.11.0
  excel: ^4.0.6
  share_plus: ^10.1.3

  # Video de fondo (login)
  video_player: ^2.9.5
  fvp: ^0.38.1

  # Mensajes/toasts animados (registro, eliminación, etc.)
  toastification: ^3.2.0
  file_picker: ^11.0.3
  tutorial_coach_mark: ^1.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  shared_preferences: ^2.2.0 # test/widget_test.dart simula el almacenamiento de Supabase

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png
    - assets/videos/login_bg.mp4
